name: Deploy Dev
on:
  push:
    branches: [main]
    paths: ['app/**', 'terraform/environments/dev/**']

permissions:
  id-token: write
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/gha-finzla-dev
          aws-region: eu-west-1
      - id: ecr
        run: |
          REPO=$(aws ecr describe-repositories --repository-names finzla-dev --query 'repositories[0].repositoryUri' --output text)
          echo "repo=$REPO" >> $GITHUB_OUTPUT
      - id: login
        uses: aws-actions/amazon-ecr-login@v2
      - id: build
        run: |
          IMAGE=${{ steps.ecr.outputs.repo }}:${{ github.sha }}
          docker build -t $IMAGE ./app
          docker push $IMAGE
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/gha-finzla-dev
          aws-region: eu-west-1
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform apply (task def / service)
        working-directory: terraform/environments/dev
        run: |
          terraform init
          terraform apply -auto-approve \
            -var="image_tag=${{ github.sha }}"

      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster finzla-dev-cluster \
            --services finzla-dev-svc

      - name: Health check
        run: |
          ALB=$(terraform -chdir=terraform/environments/dev output -raw alb_dns_name)
          for i in {1..10}; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" https://$ALB/health || true)
            [ "$CODE" = "200" ] && exit 0
            sleep 10
          done
          echo "Health check failed"; exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          PREV=$(aws ecs describe-services --cluster finzla-dev-cluster --services finzla-dev-svc \
            --query 'services[0].taskDefinition' --output text)
          aws ecs update-service --cluster finzla-dev-cluster --service finzla-dev-svc \
            --task-definition $PREV --force-new-deployment